{{ $work := .Params.work }}
{{ $items := (site.GetPage "work").Pages.ByWeight }}
<section id="work">
  <div class="wrap">
    <div class="section-head">
      <p class="eyebrow">{{ $work.eyebrow }}</p>
      <h2>{{ $work.heading }}</h2>
      <p>{{ $work.intro }}</p>
    </div>

    <div class="portfolio-grid">
      {{ range $items }}
      <a class="project-card" href="{{ .RelPermalink }}">
        <div class="shot-placeholder"><p>PHOTO NEEDED<br>{{ .Params.photo_needed }}</p></div>
        <h3>{{ .Title }}</h3>
        <p class="spec-tag">{{ .Params.spec | upper }}</p>
        <p class="desc">{{ .Params.summary }}</p>
      </a>
      {{ end }}
    </div>
  </div>
</section>
