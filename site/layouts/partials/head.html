<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Params.businessName }} — architectural design, Collingwood ON{{ else }}{{ .Title }} — {{ site.Params.businessName }}{{ end }}{{ if not site.Params.allowIndexing }} [{{ site.Params.environmentLabel | default "PREVIEW" }}]{{ end }}</title>
<meta name="description" content="{{ if .IsHome }}{{ site.Params.tagline }}{{ else }}{{ .Title }} — {{ site.Params.businessName }}{{ end }}">

{{ if site.Params.allowIndexing }}
<link rel="canonical" href="{{ .Permalink }}">
{{ else }}
<!-- Not for release: keep this off search engines and AI crawlers until Adam signs off (site.Params.allowIndexing). -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageai, noai">
<meta name="googlebot" content="noindex, nofollow">
{{ end }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

{{ $css := resources.Get "css/style.css" }}
{{ if eq hugo.Environment "development" }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{ else }}
  {{ $css = $css | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ end }}
